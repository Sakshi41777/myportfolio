<!DOCTYPE html>
<html lang="en">

    <style>
        /* General Body Styles */

body {
  margin: 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background-color: #f5f7fa; /* Light background */
  color: #333; /* Dark text for readability */
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  flex-direction: column;
  text-align: center; /* Centers the button and text */
}

/* Portfolio Tag */
#portfolio {
  font-size: 1.5rem;
  color: #6a4c9c; /* Purple */
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 30px;
  text-align: center;
}

/* Heading Styles */
h1 {
  font-size: 2rem;
  color: #7a57d1; /* Medium Purple */
  margin-bottom: 20px;
  text-align: center;
}

/* Link Button Styles */
a {
  display: inline-block;
  text-decoration: none;
  background-color: #6a4c9c; /* Dark Purple */
  color: white;
  font-weight: bold;
  padding: 10px 20px;
  border-radius: 25px; /* Rounded edges for the button */
  transition: background-color 0.2s ease;
  text-align: center;
  margin-top: 20px; /* Adds spacing between the text and the button */
}

a:hover {
  background-color: #d1a2d7; /* Lighter purple shade on hover */
}

/* Horizontal Line */
hr {
  width: 60%;
  margin-top: 30px;
  border: 0;
  border-top: 1px solid #ddd;
}

/* Footer Styling */
#footer {
  margin-top: 20px;
  font-size: 1rem;
  color: #6b7280; /* Dark gray text */
  text-align: center;
  font-style: italic;
}

</style>
